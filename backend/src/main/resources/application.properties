spring.application.name=gradion-book-illustration-studio
server.port=${BACKEND_PORT:8080}

# File-mode H2 keeps the persistence layer local and survives backend restarts.
spring.datasource.url=jdbc:h2:file:./data/gradion;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Recovery is explicit; this threshold only makes runs from a previous server instance eligible.
gradion.pipeline.stale-after=${GRADION_PIPELINE_STALE_AFTER:PT5M}
gradion.gemini.api-key=${GEMINI_API_KEY:}
gradion.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gradion.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
